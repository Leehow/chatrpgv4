[project]
name = "pi-coc-kernel"
version = "2.0.0a0"
description = "Deterministic COC kernel behind the pi-coc Pi extensions"
requires-python = "==3.14.6"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema>=4.26,<5",
  "pytest>=9.1.1,<10",
  "pytest-xdist>=3.6,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests/kernel", "tests/play"]

[tool.uv]
package = false
required-version = "==0.11.16"
